<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board</title>
    <link rel="stylesheet" href="../styles/board.css" />
    <link rel="stylesheet" href="../styles/card.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/add-task-style.css" />
    <link rel="stylesheet" href="../styles/assets.css" />
    <link rel="stylesheet" href="../styles/general-navbar-style.css" />
    <link rel="stylesheet" href="../styles/card-details.css">
    <link rel="stylesheet" href="../styles/edit-card.css">
    <link rel="icon" media="(prefers-color-scheme: light)" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" media="(prefers-color-scheme: dark)" href="../assets/icons/favicon-logo.svg"
        type="image/svg+xml" />
    <script src="../scripts/board.js" defer></script>
    <script src="../scripts/templates/emptyBoardContainerTemplate.js" defer></script>
    <script src="../scripts/templates/UserAvatarTemplate.js"></script>
    <script src="../scripts/db.js" defer></script>
    <script src="../scripts/templates/boardCardTemplate.js" defer></script>
    <script src="../scripts/templates/addTaskOverlayTemplate.js" defer></script>
    <script src="../scripts/templates/cardDetailsEditOverlayTemplate.js" defer></script>
    <script src="../scripts/add_task-script.js" defer></script>
    <script src="../scripts/addTaskOverlayBoard.js" defer></script>
    <script src="../scripts/boardCardDetails.js" defer></script>
    <script src="../scripts/boardCardDetailsEdit.js" defer></script> 
    <script src="../scripts/templates/cardDetailsOverlayTemplate.js"></script>
    <script src="../scripts/general-navbarscript.js" defer></script>
    <script src="../scripts/userCredentials.js"></script>
    <script src="../scripts/contacts.js"></script>
    <script src="../scripts/templates/addTaskUserDropdownItemTemplate.js"></script>
    <script src="../scripts/templates/checkboxTemplate.js"></script>
    <script src="../scripts/addTaskSubtasks.js"></script>
    <script src="../scripts/templates/addTaskSubtasksListTemplate.js"></script>
    <script src="../scripts/templates/addTaskEditSubtaskControlsTemplate.js"></script>
    <script src="../scripts/addTaskAssigningUsers.js"></script>
    <script src="../scripts/boardCardDragDrop.js" defer></script>
    <script src="../scripts/handleTaskInDatabase.js"></script>
    <script src="../scripts/pushTaskToDb.js"></script>
    <script src="../scripts/sortContactData.js"></script>
    <script src="../scripts/addTaskDueDate.js"></script>

</head>

<body onload="init()">
    <div class="header">
        <p class="headline-kanban">Kanban Project Management Tool</p>

        <div class="dropdown" id="dropdown">
            <a href="help.html">
                <img class="help-btn" src="../assets/img/help.png">
            </a>
            <button class="user-btn" id="userButton">☰</button>
            <div class="dropdown-content" id="dropdownContent">
                <a href="help.html">Help</a>
                <a href="legal_notice.html">Legal Notice</a>
                <a href="privacy_policy.html">Privacy Policy</a>
                <a href="#" onclick="logoutUser()">Log out</a>
            </div>
        </div>
    </div>
    <div class="navbar">
        <img class="join-logo" src="../assets/img/Capa 2 (2).svg">
        <div class="summary-menu">
            <a href="summary.html"> <button class="menu-summary-btn"><img src="../assets/icons/summary.svg"><span
                        class="navbar-size">Summary</span></button></a>
            <a href="add_task.html"> <button class="menu-summary-btn"><img src="../assets/icons/edit_square.svg"><span
                        class="navbar-size">Add Task</span></button></a>
            <a href="board.html">
                <button class="menu-summary-btn board-btn">
                    <img src="../assets/icons/board.svg" alt="Board Icon">
                    <span class="navbar-size">Board</span>
                </button>
            </a>
            <a href="contacts.html"> <button class="menu-summary-btn"><img
                        src="../assets/icons/perm_contact_calendar.svg"><span
                        class="navbar-size">Contacts</span></button></a>
        </div>
        <div class="summary-btn">
            <a href="privacy_policy.html">Privacy Police</a>
            <a href="legal_notice.html">Legal notice</a>
        </div>
    </div>
    <main class="board-wrapper">
        <section class="top-bar">
            <h1>Board</h1>
            <div class="search-and-add">
                <div class="search-input">
                    <input type="search" placeholder="Find Task" />
                    <div class="search-input-icons">
                        <img class="vertical-separator" src="../assets/icons/vertical-line-search-input.svg"
                            alt="vertical-line" />
                        <div class="search-btn-container">
                            <img class="search-btn" src="../assets/icons/search.svg" alt="search-btn" />
                        </div>
                    </div>
                </div>
                <div class="#">
                    <button class="btn-dark add-task-btn"
                        onclick="showAddTaskOverlay(); initAddTaskPage(); populateContacts()">
                        Add task
                        <img src="../assets/icons/add-plus-symbol.svg" alt="add-plus-symbol" />
                    </button>
                </div>
            </div>
        </section>
        <section class="board">
            <div class="column" id="to-do-column" ondragleave="removeHighlightCardContainer('to-do-column')"
                ondragover="dragoverHandler(event); highlightCardContainer('to-do-column')"
                ondrop="moveCardTo(1, 'to-do-column')">
                <div class="column-header">
                    <h2>To do</h2>
                    <div onclick="showAddTaskOverlay()" class="add-card">
                    </div>
                </div>
                <div class="card-container" id="to-do">
                </div>
            </div>
            <div class="column" id="in-progress-column" ondragleave="removeHighlightCardContainer('in-progress-column')"
                ondragover="dragoverHandler(event); highlightCardContainer('in-progress-column')"
                ondrop="moveCardTo(2, 'in-progress-column')">
                <div class="column-header">
                    <h2>In progress</h2>
                    <div onclick="showAddTaskOverlay()" class="add-card">
                    </div>
                </div>
                <div class="card-container" id="in-progress">
                </div>
            </div>
            <div class="column" id="await-feedback-column"
                ondragleave="removeHighlightCardContainer('await-feedback-column')"
                ondragover="dragoverHandler(event); highlightCardContainer('await-feedback-column')"
                ondrop="moveCardTo(3, 'await-feedback-column')">
                <div class="column-header">
                    <h2>Await feedback</h2>
                    <div onclick="showAddTaskOverlay()" class="add-card">
                    </div>
                </div>
                <div class="card-container" id="await-feedback">
                    <div class="card-container">
                    </div>
                </div>
            </div>
            <div class="column" id="done-column" ondragleave="removeHighlightCardContainer('done-column')"
                ondragover="dragoverHandler(event); highlightCardContainer('done-column')"
                ondrop="moveCardTo(4, 'done-column')">
                <div class="column-header">
                    <h2>Done</h2>
                </div>
                <div class="card-container" id="done">
                </div>
            </div>
        </section>
    </main>
    <section>
        <div id="addTaskOverlay" class="add-task-overlay d-none" onclick="closeAddTaskOverlay(event)">
            <div class="task-overlay-container"></div>
        </div>
    </section>
    <section>
        <div id="boardCardDetails" class="board-card-detail d-none" onclick="closeBoardCardDetails(event)"></div>
    </section>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts</title>

    <link rel="stylesheet" href="../styles/contacts.css">
    <link rel="stylesheet" href="../styles/assets.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/general-navbar-style.css">
    <link rel="stylesheet" href="../styles/render_contacts.css">
    <link rel="stylesheet" href="../styles/edit_contact-style.css">
    <link rel="stylesheet" href="../styles/add_contact_overlay.css">
    <link rel="icon" media="(prefers-color-scheme: light)" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" media="(prefers-color-scheme: dark)" href="../assets/icons/favicon-logo.svg" type="image/svg+xml" />
    <script src="../scripts/summaryscript.js" defer></script>
    <script src="../scripts/contacts.js" defer></script>
    <script src="../scripts/db.js" defer></script>
    <script src="../scripts/general-navbarscript.js" defer></script>
    <script src="../scripts/templates/renderContactsTemplate.js"></script>
    <script src="../scripts/renderContacts.js"></script>
    <script src="../scripts/templates/editContactOverlayTemplate.js"></script>
    <script src="../scripts/editContactOverlayContacts.js"></script>
    <script src="../scripts/templates/addContactOverlayTemplate.js"></script>
    <script src="../scripts/add_contact-script.js" defer></script>
    <script src="../scripts/userCredentials.js"></script>
    <script src="../scripts/pushContactToDb.js" defer></script>
    <script src="../scripts/generateContactData.js"></script>
    <script src="../scripts/sortContactData.js"></script>
</head>

  <body onload="init()">
    <header id="header">
      <div class="header">
        <p class="headline-kanban">Kanban Project Management Tool</p>

        <div class="dropdown" id="dropdown">
          <a href="help.html">
            <img class="help-btn" src="../img/icon/help.png" />
          </a>
          <button class="user-btn" id="userButton">☰</button>
          <div class="dropdown-content" id="dropdownContent">
            <a href="help.html">Help</a>
            <a href="legal_notice.html">Legal Notice</a>
            <a href="privacy_policy.html">Privacy Policy</a>
            <a href="#" onclick="logoutUser()">Log out</a>
          </div>
        </div>
      </div>
    </header>
    <aside id="navbar">
      <div class="navbar">
        <img class="join-logo" src="../img/image/Capa 2 (2).svg" />
        <div class="summary-menu">
          <a href="summary.html">
            <button class="menu-summary-btn">
              <img src="../img/icon/Summary.svg" /><span class="navbar-size">Summary</span>
            </button></a
          >
          <a href="add_task.html">
            <button class="menu-summary-btn">
              <img src="../img/icon/edit_square.svg" /><span class="navbar-size">Add Task</span>
            </button></a
          >
          <a href="board.html">
            <button class="menu-summary-btn board-btn">
              <img src="../img/icon/Board.svg" alt="Board Icon" />
              <span class="navbar-size">Board</span>
            </button>
          </a>
          <a href="contacts.html">
            <button class="menu-summary-btn">
              <img src="../img/icon/perm_contact_calendar.svg" /><span class="navbar-size">Contacts</span>
            </button></a
          >
        </div>
        <div class="summary-btn">
          <a href="privacy_policy.html">Privacy Police</a>
          <a href="legal_notice.html">Legal notice</a>
        </div>
      </div>
    </aside>
    <main>
      <section class="contact-view">
        <section>
          <div class="contact-list-wrapper">
            <div class="contact-list-header">
              <button class="btn-dark" onclick="showAddContactOverlay()">
                Add new contact <img src="../assets/icons/person_add.svg" alt="addContact_img" />
              </button>
            </div>
            <div id="contactList"></div>
          </div>
        </section>
        <section>
          <div class="contact-detail-wrapper">
            <div class="contact-detail-header">
              <h2>Contacts</h2>
              <div class="vertical-line"></div>
              <p>Better with a team</p>
            </div>
            <div id="contactDetail" class="contact-detail"></div>
          </div>
        </section>
      </section>
    </main>
    <div id="editContactOverlay" class="d-none"></div>
    <div id="addContactOverlay" class="d-none"></div>
  </body>
</html>

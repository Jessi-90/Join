<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add contant</title>
    <link rel="stylesheet" href="../styles/add_contact-style.css">
    <link rel="icon" media="(prefers-color-scheme: light)" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" media="(prefers-color-scheme: dark)" href="../assets/icons/favicon-logo.svg" type="image/svg+xml" />
    <script src="../scripts/add_contact-script.js"></script>
    <script src="../scripts/db.js"></script>
</head>

<body>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="sidebar">
                <div class="logo-container">
                    <img class="join-logo-add-contact" src="../assets/img/join-logo.svg">
                </div>
                <h1>Add contact</h1>
                <p>Tasks are better with a team!</p>
                <div class="divider"></div>
            </div>
            <div class="form-container">
                <button class="close-btn" id="close-add-contact-btn">✖</button>
                <div class="profile-picture">
                    <img src="../assets/img/Group 13.svg" alt="Profilbild">
                </div>
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Name" required>
                        <span class="icon">
                            <img src="../assets/img/person.svg" alt="User">
                        </span>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email" required>
                        <span class="icon">
                            <img src="../assets/img/mail.svg" alt="Email">
                        </span>
                    </div>
                    <div class="input-group">
                        <input type="tel" placeholder="Phone">
                        <span class="icon">
                            <img src="../assets/icons/call.svg" alt="Phone">
                        </span>
                    </div>
                    <div class="add-contact-buttons">
                        <button class="add-contact-cancel" id="cancel-contact">Cancel <img class="cancel-x"
                                src="../assets/icons/cancel.svg"></button>
                        <button class="add-contact-create" id="create-contact">Create contact <img class="create-check"
                                src="../assets/icons/check.svg"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    <link rel="stylesheet" href="../styles/general-navbar-style.css">
    <link rel="stylesheet" href="../styles/add-task-style.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="icon" media="(prefers-color-scheme: light)" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" media="(prefers-color-scheme: dark)" href="../assets/icons/favicon-logo.svg" type="image/svg+xml" />
    <script src="../scripts/add_task-script.js"></script>
</head>

<body>
    <div class="header">
        <p class="headline-kanban">Kanban Project Management Tool</p>
        
    <div class="dropdown" id="dropdown">
        <a href="help.html"> 
            <img class="help-btn" src="../img/icon/help.png">
        </a>
        <button class="user-btn" id="userButton">☰</button>
        <div class="dropdown-content" id="dropdownContent">
            <a href="help.html">Help</a>
            <a href="legal_notice.html">Legal Notice</a>
            <a href="privacy_policy.html">Privacy Policy</a>
            <a href="log_out.html">Log out</a>
        </div>
    </div>
    <div class="navbar">
        <img class="join-logo" src="../img/image/Capa 2 (2).svg">
        <div class="summary-menu">
            <a href="summary.html"> <button class="menu-summary-btn"><img src="../img/icon/Summary.svg"><span
                        class="navbar-size">Summary</span></button></a>
            <a href="add_task.html"> <button class="menu-summary-btn"><img src="../img/icon/edit_square.svg"><span
                        class="navbar-size">Add Task</span></button></a>
            <a href="board.html">
                <button class="menu-summary-btn board-btn">
                    <img src="../img/icon/Board.svg" alt="Board Icon">
                    <span class="navbar-size">Board</span>
                </button>
            </a>
            <a href="contacts.html"> <button class="menu-summary-btn"><img
                        src="../img/icon/perm_contact_calendar.svg"><span
                        class="navbar-size">Contacts</span></button></a>
        </div>
        <div class="summary-btn">
            <a href="privacy_policy.html">Privacy Police</a>
            <a href="legal_notice.html">Legal notice</a>
        </div>
    </div>

    <div class="container">
        <h1>Add Task</h1>
        <form>
            <div class="form-container" id="taskForm">
                <div class="form-column-left">
                    <div class="form-group">
                        <label for="title">Title<span class="star">*</span></label>
                        <input type="text" id="title" placeholder="Enter a title" required>
                        <span class="error-message">This field is required</span>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Enter a Description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="assigned">Assigned to</label>
                        <div class="custom-select-wrapper">
                            <select id="assigned">
                                <option>Select contacts to assign</option>
                            </select>
                            <img class="custom-arrow" src="../img/icon/arrow_drop_down.svg" alt="Dropdown Arrow">
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-column-right">
                    <div class="form-group">
                        <label for="due-date">Due date<span class="star">*</span></label>
                        <div class="date-input">
                            <input id="due-date" type="text" required placeholder="dd/mm/yyyy" maxlength="10">
                            <button type="button" class="calendar-button">
                                <img src="../img/icon/event.svg" alt="Kalender öffnen">
                            </button>
                        </div>
                        <span class="error-message">This field is required</span>
                    </div>

                    <div class="form-group">
                        <label>Prio</label>
                        <div class="prio-buttons">
                            <button type="button" class="prio-btn urgent">Urgent <img class="urgent-image"
                                    src="../img/icon/Prio alta.svg"></button>
                            <button type="button" class="prio-btn medium">Medium <img class="medium-image"
                                    src="../img/icon/Prio media (1).svg"></button>
                            <button type="button" class="prio-btn low">Low <img src="../img/icon/Prio baja.svg"></button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category<span class="star">*</span></label>
                        <div class="custom-select-wrapper">
                            <select id="category" required>
                                <option>Select task category</option>
                                <option>Technical Task</option>
                                <option>User Story</option>
                            </select>
                            <img class="custom-arrow" src="../img/icon/arrow_drop_down.svg" alt="Dropdown Arrow">
                        </div>
                        <span class="error-message">This field is required</span>
                    </div>

                    <div class="form-group">
                        <label for="subtasks">Subtasks</label>
                        <div class="input-container">
                            <input type="text" id="subtasksInput" class="input-field" placeholder="Add new subtask">
                            <button class="plus-button">+</button>
                            <div class="subtask-buttons">
                                <button type="button" class="subtask-cancel">❌</button>
                                <button type="button" class="subtask-confirm">✔️</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button type="reset" class="clear" id="clear-button">Clear <img src="../img/icon/iconoir_cancel.svg"></button>
                <button type="submit" class="create" id="create-task">Create Task <img src="../img/icon/check.svg"></button>
            </div>
        </form>

        <div class="field-required">
            <span class="star">*</span>
            <p class="note">This field is required</p>
        </div>
    </div>
</body>

</html>

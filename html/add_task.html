<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/general-navbar-style.css">
    <link rel="stylesheet" href="../styles/add-task-style.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/assets.css">
    <link rel="stylesheet" href="../styles/landscape.css">
    <link rel="icon" media="(prefers-color-scheme: light)" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" media="(prefers-color-scheme: dark)" href="../assets/icons/favicon-logo.svg" type="image/svg+xml" />
    <script src="../scripts/add_task-script.js"></script>
    <script src="../scripts/addTaskSubtasks.js"></script>
    <script src="../scripts/db.js"></script>
    <script src="../scripts/general-navbarscript.js" defer></script>
    <script src="../scripts/userCredentials.js"></script>
    <script src="../scripts/summaryscript.js"></script>
    <script src="../scripts/contacts.js"></script>
    <script src="../scripts/addTaskAssigningUsers.js"></script>
    <script src="../scripts/templates/UserAvatarTemplate.js"></script>
    <script src="../scripts/templates/checkboxTemplate.js"></script>
    <script src="../scripts/templates/addTaskUserDropdownItemTemplate.js"></script>
    <script src="../scripts/sortContactData.js"></script>
    <script src="../scripts/templates/addTaskSubtasksListTemplate.js"></script>
    <script src="../scripts/templates/addTaskEditSubtaskControlsTemplate.js"></script>
    <script src="../scripts/pushTaskToDb.js"></script>
    <script src="../scripts/authGuard.js"></script>
    <script src="../scripts/checkLandscape.js" defer></script>
    
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="../scripts/addTaskDueDate.js"></script>


</head>

<body onload="initAddTaskPage(); populateContacts()">
    <header>
        <div class="header">
            <img class="mobile-join-logo" src="../assets/img/join-logo-dark.svg" alt="join-logo">
            <p class="headline-kanban">Kanban Project Management Tool</p>
            <div class="dropdown" id="dropdown">
                <a href="help.html">
                    <img class="help-btn" src="../assets/img/help.png">
                </a>
                <button class="user-btn" id="userButton">☰</button>
                <div class="dropdown-content" id="dropdownContent">
                    <a href="help.html">Help</a>
                    <a href="legal_notice.html">Legal Notice</a>
                    <a href="privacy_policy.html">Privacy Policy</a>
                    <a href="#" onclick="logoutUser()">Log out</a>
                </div>
            </div>
        </div>
    </header>
    <aside>
        <div class="navbar">
            <div class="upper-navbar">
                <img class="join-logo" src="../assets/img/join-logo.svg">
                <div class="summary-menu">
                    <a href="summary.html"> <button class="menu-summary-btn"><img src="../assets/icons/summary.svg"><span
                                class="navbar-size">Summary</span></button></a>
                    <a href="add_task.html"> <button class="menu-summary-btn"><img src="../assets/icons/edit_square.svg"><span
                                class="navbar-size">Add Task</span></button></a>
                    <a href="board.html">
                        <button class="menu-summary-btn board-btn">
                            <img src="../assets/icons/board.svg" alt="Board Icon">
                            <span class="navbar-size">Board</span>
                        </button>
                    </a>
                    <a href="contacts.html"> <button class="menu-summary-btn"><img
                                src="../assets/icons/contact-icon.svg"><span
                                class="navbar-size">Contacts</span></button></a>
                </div>
            </div>
            <div class="summary-btn">
                <a href="privacy_policy.html">Privacy Police</a>
                <a href="legal_notice.html">Legal notice</a>
            </div>
        </div>
    </aside>
    <main>
        <div class="container">
            <h1>Add Task</h1>
            <form>
                <div class="form-container" id="taskForm">
                    <div class="form-column-left">
                        <div class="form-group">
                            <label for="title">Title<span class="star">*</span></label>
                            <input type="text" id="title" placeholder="Enter a title" required>
                            <span class="error-message">This field is required</span>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" placeholder="Enter a Description"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="due-date">Due date<span class="star">*</span></label>
                            <input type="text" name="due-date" id="datepicker" readonly>
                            <span class="error-message">This field is required</span>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="form-column-right">
                        <div class="form-group">
                            <label>Prio</label>
                            <div class="prio-buttons">
                                <button type="button" class="prio-btn urgent">Urgent <img class="urgent-image"
                                        src="../assets/icons/prio urgent.svg"></button>
                                <button type="button" class="prio-btn medium">Medium <img class="medium-image"
                                        src="../assets/icons/prio medium.svg"></button>
                                <button type="button" class="prio-btn low">Low <img
                                        src="../assets/icons/prio low.svg"></button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="assigned">Assigned to</label>
                            <div class="custom-dropdown" id="assignedDropdown">
                                <div class="selected-option" onclick="toggleDropdown()">
                                    Select contacts to assign
                                    <img class="custom-arrow" src="../assets/icons/arrow_drop_down.svg"
                                        alt="Dropdown Arrow">
                                </div>
                                <ul class="dropdown-options d-none" id="dropdownOptions"></ul>
                            </div>
                            <div id="selectedContactsContainer" class="selected-contacts-container"></div>
                        </div>
                        <div class="form-group">
                            <label for="category">Category<span class="star">*</span></label>
                            <div class="custom-select-wrapper">
                                <select id="category" required>
                                    <option>Select task category</option>
                                    <option>Technical Task</option>
                                    <option>User Story</option>
                                </select>
                                <img class="custom-arrow" src="../assets/icons/arrow_drop_down.svg" alt="Dropdown Arrow">
                            </div>
                            <span class="error-message">This field is required</span>
                        </div>
                        <div class="form-group">
                            <label for="subtasks">Subtasks</label>
                            <div class="input-container">
                                <input type="text" id="subtasks" class="input-field" placeholder="Add new subtask">
                                <button id="standard-subtask-btn" class="subtask-btn plus-btn" onclick="setFocusOnInput(event)"></button>
                                <div id="subtask-controls" class="subtask-nav d-none">
                                    <button onclick="clearInputField(event)" id="clear-subtask-btn"
                                        class="subtask-btn clear-subtask-btn"></button>
                                    <div class="subtask-separator"></div>
                                    <button id="add-subtask-btn" class="subtask-btn add-subtask-btn"></button>
                                </div>
                            </div>
                            <ul id="subtask-list"></ul>
                        </div>
                    </div>
                </div>
                <div class="buttons">
                    <button onclick="clearFormAndData()" type="reset" class="clear btn-light" id="clear-button">
                        Clear
                        <img id="clear-icon" src="../assets/icons/cancel.svg">
                    </button>
                    <button type="submit" class="create" id="create-task" onclick="sendTaskFormToDb()" disabled>
                        Create Task
                        <img src="../assets/icons/check.svg">
                    </button>
                </div>
            </form>
            <div class="field-required">
                <span class="star">*</span>
                <p class="note">This field is required</p>
            </div>
        </div>
    </main>
    <section>
        <div class="landscape-warning" id="landscapeWarning">Please rotate your device in portrait mode.</div>
    </section>
        <footer>
            <div class="mobile-navbar">
                <a href="summary.html"> <button class="menu-summary-btn"><img src="../assets/icons/summary.svg"><span
                    class="navbar-size">Summary</span></button></a>
                <a href="board.html">
                    <button class="menu-summary-btn board-btn">
                        <img src="../assets/icons/board.svg" alt="Board Icon">
                        <span class="navbar-size">Board</span>
                    </button>
                </a>
                <a href="add_task.html"> <button class="menu-summary-btn"><img src="../assets/icons/edit_square.svg"><span
                            class="navbar-size">Add Task</span></button></a>
                <a href="contacts.html"> <button class="menu-summary-btn"><img
                            src="../assets/icons/contact-icon.svg"><span
                            class="navbar-size">Contacts</span></button></a>
            </div>
        </footer>    
</body>

<script>
    

  $(function() {
    $("#datepicker").datepicker({
      dateFormat: "dd/mm/yy",
          changeMonth: true,
          changeYear: true,
              showButtonPanel: false,
                              showAnim: "slideDown",
                                  onClose: function(dateText, inst) {
                                        $(this).blur();
                                        }
                                         });

    });

</script>
    
</html>

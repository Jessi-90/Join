<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt hinzufügen</title>
    <link rel="stylesheet" href="add_contact-style.css">
    <script src="add_contact-script.js"></script>
</head>

<body>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="sidebar">
                <img class="join-logo" src="img/icon/Capa 2 (2).svg">
                <h1>Add contact</h1>
                <p>Tasks are better with a team!</p>
            </div>
            <div class="form-container">
                <button class="close-btn" onclick="closeOverlay()">✖</button>
                <div class="profile-picture">
                    <img src="img/icon/Group 13.svg" alt="Profilbild">
                </div>
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Name" required>
                        <span class="icon">👤</span>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email" required>
                        <span class="icon">📧</span>
                    </div>
                    <div class="input-group">
                        <input type="tel" placeholder="Phone">
                        <span class="icon">📞</span>
                    </div>
                    <div class="buttons">
                        <button type="button" class="cancel" onclick="closeOverlay()">Cancel ✖</button>
                        <button type="submit" class="create">Create contact ✔</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <button onclick="openOverlay()">Open Contact Form</button>

</body>

</html>

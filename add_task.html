<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    <link rel="stylesheet" href="add-task-style.css">
</head>

<body>
    <div class="container">
        <h1>Add Task</h1>
        <form>
            <div class="form-container">
                <div class="form-column-left">
                    <div class="form-group">
                        <label for="title">Title<span class="star">*</span></label>
                        <input type="text" id="title" placeholder="Enter a title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Enter a Description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="assigned">Assigned to</label>
                        <select id="assigned">
                            <option>Select contacts to assign</option>
                        </select>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-column-right">
                    <div class="form-group">
                        <label for="due-date">Due date<span class="star">*</span></label>
                        <div class="date-input">
                            <input id="due-date" required>
                            <button type="button" class="calendar-button">
                                <img src="img/icon/event.svg" alt="Kalender öffnen">
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Prio</label>
                        <div class="prio-buttons">
                            <button type="button" class="urgent">Urgent <img class="urgent-image" src="img/icon/Prio alta.svg"></button>
                            <button type="button" class="medium active">Medium 
                                <img class="medium-image" src="img/icon/Prio media (1).svg"></button>
                            <button type="button" class="low">Low <img src="img/icon/Prio baja.svg"></button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category<span class="star">*</span></label>
                        <select id="category" required>
                            <option>Select task category</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subtasks">Subtasks</label>
                        <input type="text" id="subtasks" placeholder="Add new subtask">
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button type="reset" class="clear">Clear</button>
                <button type="submit" class="create">Create Task</button>
            </div>
        </form>

        <div class="field-required">
            <span class="star">*</span>
            <p class="note">This field is required</p>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/sign_up.css">
</head>
<body>
    <main>
        <div class="sign-up-sidebar"><img src="./img/Capa.svg" alt="Join_logo"></div>
        <div class="sign-up-content">
            <div class="sign-up-wrapper">
                <div class="sign-up-header">
                    <button type="button"><a href="./index.html"><img src="./img/arrow-left-line.svg" alt="back to login"></a></button>
                    <h1>Sign Up</h1>
                </div>
                <form action="submit" class="sign-up-form">
                    <input type="text" placeholder="Name">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">
                    <input type="password" placeholder="Confirm Password">
                    <input type="checkbox" name="" id="signUpPpCheckbox">
                    <button type="submit">Sign Up</button>
                </form>
            </div>
            <div class="sign-up-footer">
                <a href="./privacy_policy.html">Privacy Policy</a>
                <a href="./legal_notice.html">Legal Notice</a>
            </div>
        </div>
    </main>

</body>
</html>

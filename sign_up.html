<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/sign_up.css">
</head>
<body>
    <main>
        <div class="sign-up-sidebar"><img src="./assets/img/Capa.svg" alt="Join_logo"></div>
        <div class="sign-up-content">
            <div class="sign-up-wrapper">
                <div class="sign-up-header">
                    <button type="button"><a href="./index.html"><img src="./assets/icons/arrow-left-line.svg" alt="back to login"></a></button>
                    <div class="sign-up-header-text">
                        <h1>Sign Up</h1>
                        <div class="horizontal-line"></div>
                    </div>
                </div>
                <form action="submit" class="sign-up-form">
                    <input type="text" placeholder="Name" class="input-bg-user sign-up-input-field">
                    <input type="email" placeholder="Email" class="input-bg-email sign-up-input-field">
                    <input type="password" placeholder="Password" class="input-bg-pwd sign-up-input-field">
                    <input type="password" placeholder="Confirm Password" class="input-bg-pwd sign-up-input-field">
                    <p id="signUpPasswordMismatch" class="warning-info text-left-up d-none">Ups! your password don’t match. </p>
                    <div class="sign-up-form-checkbox-box">
                        <input type="checkbox" name="signUpPpCheckbox" id="signUpPpCheckbox">
                        <label for="signUpPpCheckbox" class="sign-up-terms-of-conditions">I accept the <a href="./privacy_policy.html">Privacy Policy</a></label>
                    </div>
                    <button type="submit" class="btn-dark">Sign Up</button>
                </form>
            </div>
            <div class="sign-up-footer">
                <a href="./privacy_policy.html">Privacy Policy</a>
                <a href="./legal_notice.html">Legal Notice</a>
            </div>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Log in</title>
		<link rel="stylesheet" href="./styles/style.css" />
		<link rel="stylesheet" href="./styles/standard.css" />
		<link rel="stylesheet" href="./styles/assets.css" />
		<link rel="stylesheet" href="./styles/log_in.css" />
    <link rel="stylesheet" href="./styles/logo-animation.css">
		<link rel="icon" media="(prefers-color-scheme: light)" href="./assets/icons/favicon.svg" type="image/svg+xml" />
		<link rel="icon" media="(prefers-color-scheme: dark)" href="./assets/icons/favicon-logo.svg" type="image/svg+xml" />
		<script src="./scripts/script.js"></script>
		<script src="./scripts/guestLogin.js"></script>
		<script src="./scripts/db.js"></script>
	</head>

	<body onclick="resetInputIcon()">
		<div class="animation-overlay" id="animation-overlay"></div>
		<div class="log-in-page">
			<div class="log-in-header">
				<img id="start-logo" src="./assets/img/Capa.svg" alt="Join_logo" />
				<div class="link-to-sing-up-page">
					<p>Not a Join user?</p>
					<a href="./html/sign_up.html" class="btn-dark sign-up-btn"> Sign up </a>
				</div>
			</div>
			<div class="log-in-content">
				<div class="log-in-wrapper">
					<div class="log-in-title">
						<div class="log-in-title-text">
							<h1>Log in</h1>
							<div class="horizontal-line"></div>
						</div>
					<form action="submit" class="log-in-form">
						<input id="input-mail" type="email" placeholder="Email" class="input-bg-email log-in-input-field" />
						<div class="input-password-wrapper">
							<input
								onclick="protectionEventBubbeling(event)"
								onfocus="toggleInputIcon(event)"
								onblur="toggleInputIcon(event)"
								id="input-password"
								type="password"
								placeholder="Password"
								class="input-bg-pwd log-in-input-field margin-b20"
							/>
							<img
								onclick="protectionEventBubbeling(event), togglePasswordVisibility()"
								id="input-password-icon"
								src="./assets/icons/lock_icon.svg"
								alt="lock-icon"
							/>
						</div>

						<div class="login-btn-wrapper">
							<button type="submit" class="btn-dark" disabled>Log in</button>
							<button type="submit" class="btn-light" id="guest-login" onclick="guestLogIn(event)">Guest Log in</button>
						</div>
					</form>
				</div>
			</div>
			<div class="log-in-footer">
				<a href="./privacy_policy.html"> Privacy Policy </a>
				<a href="./legal_notice.html"> Legal Notice </a>
			</div>
		</div>
	</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Summary user</title>
    <link rel="stylesheet" href="summaryhtml-style.css">

<body>

    <div class="layout">
        <img src="./img/image/Frame 40.png">

    <div class="to-do-dashboard">

            <a href="board.html">
                <div class="card-todo">


                    <div class="card card-todo">

                        <div>
                            <h1>1</h1>
                            <p>To-do</p>
                        </div>
                    </div>
            </a>


            <a href="board.html">
                <div class="card card-todo">
                    <img class="card-ok" src="./img/icon/Frame 71-1.png"> 

                    <div>
                        <h1>1</h1>

                    </div>
                </div>

            </a>
        </div>


        <a href="board.html" class="card large-card">
            <img class="urgent-img" src="./img/icon/Frame 71-2.png">

                <h1>1</h1>
                <p>Urgent</p>
            </div>

        <a href="board.html">

            <div class="card">
                <div>

                    <p>Tasks in Board</p>
                </div>
            </div>

            <div class="card">
                <div>
                    <h1>2</h1>
                    <p>Tasks In Progress</p>
                </div>
            </div>

            <div class="card">
                <div>
                    <h1>2</h1>
                    <p>Awaiting Feedback</p>
                </div>
            </div>

    </div>

        </p>

    </div>

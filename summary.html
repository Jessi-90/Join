<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary user</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">
        <img class="join-logo" src="./img/Capa 2 (2).svg">
        <div class="summary-menu">
            <button class="menu-summary-btn"><img src="./img/summary-btn.png"></button>
            <button class="menu-summary-btn"><img src="./img/Add Task.svg"></button>
            <button class="menu-summary-btn"><img src="./img/Board.svg"></button>
            <button class="menu-summary-btn"><img src="./img/Contacts.svg"></button>
        </div>
        <div class="summary-btn">
            <button>Privacy Police</button>
            <button>Legal notice</button>
        </div>
    </div>

    <div class="header">Kanban Project Management Tool</div>

    <div class="layout">
        <img src="./img/Frame 40.png">
    </div>

    <div class="dashboard">
        <div class="card">
            <img src="./img/Frame 71.png">
            <h1>1</h1>
            <p>To-do</p>
        </div>
        <div class="card">
            <img src="./img/Frame 71-1.png">
            <h1>1</h1>
            <p>Done</p>
        </div>
        <div class="card large-card">
            <img src="./img/Frame 71-2.png">
            <h1>1</h1>
            <div class="urgent-info">
                <p>Urgent</p>
                <p>October 16, 2022</p>
                <p>Upcoming Deadline</p>
            </div>
        </div>
        <div class="card">
            <h1>5</h1>
            <p>Tasks in Board</p>
        </div>
        <div class="card">
            <h1>2</h1>
            <p>Tasks In Progress</p>
        </div>
        <div class="card">
            <h1>2</h1>
            <p>Awaiting Feedback</p>
        </div>
    </div>
</body>

</html>
